name: build-metal-ipa

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-14, macos-13, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      APP_NAME: GoodColorCam
      BUNDLE_ID: com.gcc.goodcolorcam.metal

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -e
          for XC in /Applications/Xcode_15.4.app /Applications/Xcode_15.3.app /Applications/Xcode_15.2.app; do
            if [ -d "$XC" ]; then sudo xcode-select -s "$XC"; break; fi
          done
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Show source inventory
        run: |
          echo "--- src ---"
          ls -la src/ | head -50
          echo "--- resources ---"
          if [ -d RESOURCES/effect ]; then
            echo "effect files: $(find RESOURCES/effect -type f | wc -l)"
            du -sh RESOURCES/effect
          else
            echo "::error::RESOURCES/effect missing"
            exit 1
          fi
          echo "--- metal ---"
          ls -lh src/*.metal

      - name: Assemble Xcode project
        run: |
          set -e
          mkdir -p GoodColorCam.xcodeproj
          # 纯 Metal 架构：整套 src/*.m/.c/.metal 全编。
          # 不嵌任何官方 vendor 库；effect_dynamic.c 的 constructor 会自动装
          # no-op 桩，bef_init 在无库时安全返回，Metal 渲染链完全独立。
          # test_mesh.c 带 main()，用 GCC_STANDALONE_TEST 守卫，排除。
          SRC=$(ls src/*.m src/*.c 2>/dev/null | grep -v 'src/test_mesh.c' | tr '\n' ' ')
          echo "sources: $SRC"
          [ -n "$SRC" ] || { echo "::error::no sources"; exit 1; }
          python3 scripts/gen_pbxproj.py \
            --out GoodColorCam.xcodeproj/project.pbxproj \
            --src $SRC \
            --resource-folder RESOURCES/effect \
            --bundle-id "$BUNDLE_ID" \
            --app-name "$APP_NAME"

      - name: Build unsigned
        run: |
          set -o pipefail
          xcodebuild \
            -project GoodColorCam.xcodeproj \
            -scheme "$APP_NAME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Compile Metal shaders
        run: |
          set -e
          APP_DIR=$(find build/Build/Products -name '*.app' -type d | head -1)
          [ -n "$APP_DIR" ] || { echo "::error::no .app"; exit 1; }
          echo "--- xcrun metal ---"
          xcrun -sdk iphoneos metal -c src/gcc_beauty.metal -o /tmp/gcc_beauty.air
          xcrun -sdk iphoneos metallib /tmp/gcc_beauty.air -o "$APP_DIR/default.metallib"
          # 源码兜底：运行时 newLibraryWithSource 也能命中（resourceRoot = effect/）
          cp src/gcc_beauty.metal "$APP_DIR/effect/gcc_beauty.metal"
          # 图标落进 app 根
          for f in AppIcon60x60@2x.png AppIcon60x60@3x.png AppIcon1024.png; do
            [ -f "RESOURCES/$f" ] && cp "RESOURCES/$f" "$APP_DIR/$f" || true
          done
          test -f "$APP_DIR/default.metallib" || { echo "::error::default.metallib missing"; exit 1; }
          ls -lh "$APP_DIR/default.metallib" || true
          ls -lh "$APP_DIR"/AppIcon*.png || true

      - name: Verify binary
        run: |
          APP_DIR=$(find build/Build/Products -name '*.app' -type d | head -1)
          echo "app: $APP_DIR"
          [ -n "$APP_DIR" ] || { echo "::error::no .app"; exit 1; }
          APP_BIN="$APP_DIR/$APP_NAME"
          echo "--- linked dylibs (should be system-only) ---"
          otool -L "$APP_BIN" || true
          echo "--- metallib present? ---"
          test -f "$APP_DIR/default.metallib" || { echo "::error::default.metallib MISSING"; exit 1; }
          find "$APP_DIR" -name '*.metallib' | head -5
          echo "--- LC_RPATH ---"
          otool -l "$APP_BIN" | grep -A2 LC_RPATH | grep path || true

      - name: Package unsigned IPA
        run: |
          set -e
          APP_DIR=$(find build/Build/Products -name '*.app' -type d | head -1)
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          # 无 vendored framework，纯系统框架 + Metal
          python3 - <<'PY'
          import zipfile, os
          out = os.environ.get('IPA','GoodColorCam-metal-unsigned.ipa')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for r,ds,fs in os.walk('Payload'):
                  for f in fs:
                      p=os.path.join(r,f)
                      z.write(p,p)
          print('packed',os.path.getsize(out))
          PY
          ls -lh GoodColorCam-metal-unsigned.ipa

      - name: Ad-hoc sign (plain, no entitlements)
        run: |
          set -e
          # 纯 Metal 包无 vendor dylib，只需主程序 ad-hoc 伪签。
          # ★ 必须在解压目录「内」签名，再从该目录重打包，
          #   否则 codesign 生成的 _CodeSignature/CodeResources 不会被带进 IPA。
          WORK=$(mktemp -d)
          cd "$WORK"
          python3 - <<'PY'
          import zipfile, os, shutil
          src = os.environ['IPA_IN']
          with zipfile.ZipFile(src) as z:
              for info in z.infolist():
                  if info.is_dir(): continue
                  dst = info.filename
                  os.makedirs(os.path.dirname(dst) or '.', exist_ok=True)
                  with z.open(info) as s, open(dst,'wb') as w:
                      shutil.copyfileobj(s, w, 1<<20)
                  mode = (info.external_attr >> 16) & 0o777
                  if mode & 0o111: os.chmod(dst, (mode | 0o755) & 0o777)
          print('unpacked')
          PY
          APP_DIR=$(find Payload -maxdepth 1 -name '*.app' -type d | head -1)
          echo "APP_DIR=$APP_DIR"
          /usr/bin/codesign --force --sign - --timestamp=none "$APP_DIR"
          echo "--- signature check ---"
          /usr/bin/codesign -dv "$APP_DIR" 2>&1 | head -8 || true
          test -f "$APP_DIR/_CodeSignature/CodeResources" || { echo "::error::CodeResources missing"; exit 1; }
          python3 - <<'PY'
          import zipfile, os
          out = os.environ['IPA_OUT']
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for r,ds,fs in os.walk('Payload'):
                  for f in fs:
                      p=os.path.join(r,f); z.write(p,p)
          print('repacked',os.path.getsize(out))
          PY
          ls -lh "$IPA_OUT"
          echo "--- final IPA signature entries ---"
          python3 - <<'PY'
          import zipfile, os
          z=zipfile.ZipFile(os.environ['IPA_OUT'])
          print([n for n in z.namelist() if '_CodeSignature' in n][:4])
          PY
        env:
          IPA_IN: ${{ github.workspace }}/GoodColorCam-metal-unsigned.ipa
          IPA_OUT: ${{ github.workspace }}/GoodColorCam-metal-adhoc.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-metal-ipa-${{ matrix.os }}
          path: |
            GoodColorCam-metal-unsigned.ipa
            GoodColorCam-metal-adhoc.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          set -e
          TAG="metal-$(echo ${{ github.sha }} | cut -c1-7)-${MATRIX_OS}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            GoodColorCam-metal-unsigned.ipa \
            GoodColorCam-metal-adhoc.ipa \
            --title "Metal IPA ($TAG)" \
            --notes "Pure Metal build. No AwemeCore / EffectSDK / vendor dylibs. Ad-hoc signed for jailbroken devices; re-sign with your own certificate for stock iOS." \
            --prerelease

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
